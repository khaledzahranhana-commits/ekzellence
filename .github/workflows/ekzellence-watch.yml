name: eKZellence Watch Android beta
on:
  workflow_dispatch:
  push:
    branches: [ekzellence-watch-app]
    paths: ['watch/**', '.github/workflows/ekzellence-watch.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: gradle :app:assembleDebug
      - run: node tests/worker.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: eKZellence-Watch-beta
          path: watch/app/build/outputs/apk/debug/app-debug.apk
